# Elasticsearch config - now with separate host, port, protocol
#elasticsearch:
#  host: localhost
#  port: 9200
#  protocol: http
#  username: elastic
#  password: elastic123
elasticsearch:
  host: elasticsearch.efk.svc.cluster.local
  port: 9200
  protocol: http
  username: "${ES_USER}"
  password: "${ES_PASSWORD}"
  # Connection pool sized for ~2000 TPS workload
  pool:
    max-conn-total: 400
    max-conn-per-route: 200
    io-thread-count: 8
    connect-timeout-ms: 5000
    socket-timeout-ms: 60000
    connection-request-timeout-ms: 5000

sessions-data: radius-sessions

kafka:
  bootstrap:
    servers: kafka-headless.cluster-dc.svc.cluster.local:9092


mp:
  messaging:
    incoming:
      accounting-cdr-events:
        connector: smallrye-kafka
        topic: cdr-event-dc
        group.id: cdr-service
        value.deserializer: io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
        enable.auto.commit: true
        max.poll.records: 500
        max.poll.interval.ms: 300000
        session.timeout.ms: 30000
        fetch.min.bytes: 1024
        fetch.max.bytes: 52428800
        max.partition.fetch.bytes: 10485760
        receive.buffer.bytes: 65536
        failure-strategy: ignore
        close-timeout: 30000

      accounting-cdr-events-mirror:
        connector: smallrye-kafka
        topic: dc.cdr-event-dr
        group.id: cdr-service
        value.deserializer: io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto.offset.reset: earliest
        enable.auto.commit: true
        max.poll.records: 500
        max.poll.interval.ms: 300000
        session.timeout.ms: 30000
        fetch.min.bytes: 1024
        fetch.max.bytes: 52428800
        max.partition.fetch.bytes: 10485760
        receive.buffer.bytes: 65536
        failure-strategy: ignore
        close-timeout: 30000
