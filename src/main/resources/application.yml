# Elasticsearch config - now with separate host, port, protocol
#elasticsearch:
#  host: localhost
#  port: 9200
#  protocol: http
#  username: elastic
#  password: elastic123
elasticsearch:
  host: elasticsearch.efk.svc.cluster.local
  port: 9200
  protocol: http
  username: "${ES_USER}"
  password: "${ES_PASSWORD}"
  # Connection pool sized for ~2000 TPS workload
  pool:
    max-conn-total: 50
    max-conn-per-route: 50
    io-thread-count: 2
    connect-timeout-ms: 5000
    socket-timeout-ms: 60000
    connection-request-timeout-ms: 5000

# Time zone every CDR timestamp is reported in: the startTime/endTime/updatedTime of a session,
# the dateTime of each of its instances, and the date suffix of the daily index those documents
# are written to. Timestamps are stored as absolute instants and converted to this zone on the
# way out, so the session list and the session details show one and the same clock time.
# Defaults to the pod's TZ, so a deployment that sets TZ needs nothing here.
app:
  timezone: "${TZ:UTC}"

sessions-data: radius-sessions

kafka:
  bootstrap:
    servers: kafka-headless.cluster-dc.svc.cluster.local:9092

# Airtel Kafka cluster the consumed AccountingEvents are republished to, verbatim.
# Defaults to the cluster the events are consumed from, so a deployment that shares one
# broker set only has to set the topic.
airtel:
  kafka:
    bootstrap-servers: "${AIRTEL_KAFKA_BOOTSTRAP_SERVERS:kafka-headless.cluster-dc.svc.cluster.local:9092}"
    topic: "${AIRTEL_KAFKA_TOPIC:cdr-event-airtel}"
    # Longest a consumer waits for the Airtel broker to acknowledge one event. Past it the record
    # stays queued in the producer (and is still delivered) but the consumer lane moves on, so an
    # Airtel outage cannot hold up CDR processing.
    publish-timeout-ms: "${AIRTEL_KAFKA_PUBLISH_TIMEOUT_MS:10000}"

mp:
  messaging:
    incoming:
      accounting-cdr-events:
        connector: smallrye-kafka
        topic: cdr-event-dc
        group:
          id: cdr-service
        value:
          deserializer: io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto:
          offset:
            reset: earliest
        enable:
          auto:
            commit: false
        max:
          poll:
            records: 500
            interval:
              ms: 30000
          partition:
            fetch:
              bytes: 1048576
        poll-timeout: 5000
        session:
          timeout:
            ms: 30000
        heartbeat:
          interval:
            ms: 10000
        fetch:
          min:
            bytes: 1
          max:
            bytes: 10485760
        receive:
          buffer:
            bytes: 65536
        connections:
          max:
            idle:
              ms: 540000
        failure-strategy: ignore
        # Process partitions concurrently while preserving in-partition (per-session-key)
        # ordering. Each lane is an independent Kafka consumer client in group.id above, so a
        # pod only uses as many lanes as it is assigned partitions; the rest stay idle.
        concurrency: 6

      accounting-cdr-events-mirror:
        connector: smallrye-kafka
        topic: dr.cdr-event-dr
        group:
          id: cdr-service-mirror
        value:
          deserializer: io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        auto:
          offset:
            reset: earliest
        enable:
          auto:
            commit: false
        max:
          poll:
            records: 500
            interval:
              ms: 30000
          partition:
            fetch:
              bytes: 1048576
        poll-timeout: 5000
        session:
          timeout:
            ms: 30000
        heartbeat:
          interval:
            ms: 10000
        fetch:
          min:
            bytes: 1
          max:
            bytes: 10485760
        receive:
          buffer:
            bytes: 65536
        connections:
          max:
            idle:
              ms: 540000
        failure-strategy: ignore
        # See accounting-cdr-events.
        concurrency: 6

    outgoing:
      # Airtel's copy of the CDR stream. Every consumed AccountingEvent is republished here
      # unchanged — the same object, serialized by the same application ObjectMapper the incoming
      # channel deserialized it with, so the JSON on this topic matches the JSON that was consumed.
      airtel-accounting-events:
        connector: smallrye-kafka
        topic: "${airtel.kafka.topic}"
        bootstrap.servers: "${airtel.kafka.bootstrap-servers}"
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
        value.serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer
        # Forwarding must never gate CDR processing, so the Airtel broker is deliberately kept out
        # of the service's health checks: an outage there is logged and counted (layer=producer,
        # source=kafka) but leaves the pod ready and the consumers running.
        health-enabled: false
        acks: "1"
        # Batch a few milliseconds' worth of records instead of one request per event; at ~2000 TPS
        # this is the difference between a handful of requests and thousands per second.
        linger.ms: 5
        batch.size: 65536
        buffer.memory: 33554432
        request.timeout.ms: 30000
        delivery.timeout.ms: 120000
        max.in.flight.requests.per.connection: 5
        close-timeout: 30000

# Dependency connectivity monitoring (Redis / Kafka / Elasticsearch)
# Failures seen on live traffic and the periodic probes below drive the
# dependency_up / dependency_connectivity_failure_count metrics scraped by Prometheus
# and charted in the "AAA CDR - Dependency Connectivity" Grafana dashboard.
connectivity:
  service-name: cdr-service    # value of the `service` tag on every dependency_* metric
  enabled: true
  failure-threshold: 3          # consecutive connectivity failures before a dependency is marked DOWN
  probe-interval: 15s           # how often each dependency is pinged
  probe-timeout-ms: 2000        # per-probe budget; a slower answer counts as a failure
  probe-redis: true             # PING
  probe-kafka: true             # AdminClient describeCluster
  probe-elasticsearch: true     # ping
